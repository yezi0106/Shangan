<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>极简错题本 (Pro)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        panel: 'var(--color-panel)',
                        textMain: 'var(--color-text-main)',
                        textMuted: 'var(--color-text-muted)',
                        borderMain: 'var(--color-border)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #C8D986; 
            --color-primary-text: #4A4A4A;
            --color-primary-light: #C8D98625;
            
            --color-btn-1: #F5F7EB; 
            --color-btn-2: #E2EBC1; 
            --color-btn-3: #C8D986; 
            --color-btn-4: #9DB44E;   
            
            --color-btn-1-text: #4A4A4A;
            --color-btn-2-text: #4A4A4A;
            --color-btn-3-text: #4A4A4A;
            --color-btn-4-text: #FFFFFF;
            
            --bg-main-fill: #F7F9ED; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --color-panel: #FFFFFF;
            
            --color-text-main: #4A4A4A;
            --color-text-muted: #9CA3AF;
            --color-border: rgba(0,0,0,0.06);
        }

        .dark {
            --glass-bg: rgba(18, 18, 18, 0.85);
            --color-panel: #1E1E1E;
            
            --color-text-main: #E5E5E5;
            --color-text-muted: #888888;
            --color-border: rgba(255,255,255,0.08);
        }

        body { 
            background: var(--bg-main-fill);
            background-attachment: fixed;
            color: var(--color-text-main);
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .card-shadow {
            background: var(--color-panel);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
            border: 1px solid var(--color-border);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        input[type="file"] { display: none; }
        .touch-zoom { touch-action: pan-x pan-y pinch-zoom; }
        #answer-blocker { touch-action: none; } 
        
        .sortable-ghost { opacity: 0.4; }
        .sortable-drag { cursor: grabbing !important; }

        .theme-text { color: var(--color-primary) !important; }
        .theme-bg { background: var(--color-primary); color: var(--color-primary-text); }
        
        /* 智能间距，适配各种设备刘海和底部 */
        .pt-safe { padding-top: max(env(safe-area-inset-top), 16px); }
        .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
        
        .pt-main { padding-top: calc(max(env(safe-area-inset-top), 16px) + 60px); }
        .pb-main { padding-bottom: calc(max(env(safe-area-inset-bottom), 16px) + 80px); }


    </style>
</head>
<body class="h-screen font-sans overflow-hidden relative">
    
    <!-- 顶栏收窄，使用 pt-safe 替代固定的 pt-12 -->
    <header class="absolute top-0 left-0 right-0 pt-safe pb-2 px-6 flex justify-between items-center z-40 transition-colors duration-300" style="background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--color-border);">
        <div class="flex items-center gap-2 mt-1">
            <h1 class="text-2xl font-bold tracking-tight" id="header-title">今日复习</h1>
        </div>
        <button onclick="openModal('theme-modal')" class="w-9 h-9 mt-1 rounded-xl flex items-center justify-center text-textMain active:scale-95 transition-all hover:bg-black/5" style="border: 1px solid var(--color-border);">
            <i class="ph-bold ph-palette text-lg"></i>
        </button>
    </header>

    <main class="absolute inset-0 overflow-y-auto no-scrollbar px-3 md:px-6 pt-main pb-main" id="main-container">
        
        <!-- Tab 1: 复习卡片 (Review) -->
        <div id="tab-review" class="h-full flex flex-col fade-in max-w-4xl mx-auto w-full pt-1">
            <div id="review-empty" class="hidden flex-1 flex flex-col items-center justify-center text-center gap-4">
                <div class="w-24 h-24 rounded-full flex items-center justify-center mb-2 shadow-sm transition-colors" style="background: var(--color-primary-light);">
                    <i class="ph-bold ph-check-circle text-5xl theme-text"></i>
                </div>
                <h2 class="text-2xl font-bold">复习完成！</h2>
                <p class="text-sm text-textMuted">今日所有错题已清空，真棒</p>
                <button onclick="switchTab('upload')" class="mt-4 font-bold py-3.5 px-10 rounded-2xl active:scale-95 transition-transform shadow-md theme-bg">
                    去录入新错题
                </button>
            </div>

            <div id="review-content" class="h-full flex flex-col hidden relative">
                <div class="flex justify-between items-center px-2 mb-2">
                    <span class="text-xs font-bold text-textMuted uppercase tracking-wider" id="review-progress">进度: 1 / 10</span>
                </div>
                
                <div class="flex-1 card-shadow rounded-3xl flex items-center justify-center overflow-hidden mb-5 relative group" id="review-image-container">
                    <img id="review-image" src="" class="w-full h-full object-contain transition-opacity duration-300 touch-zoom p-2">
                    
                    <button onclick="toggleBlocker()" class="absolute top-4 left-4 w-10 h-10 bg-black/40 backdrop-blur-md text-white rounded-xl flex items-center justify-center active:scale-90 z-20 hover:bg-black/50 transition">
                        <i class="ph-bold ph-mask-happy text-lg"></i>
                    </button>
                    
                    <div id="answer-blocker" class="hidden absolute top-20 left-10 w-48 h-24 bg-gray-900/95 backdrop-blur-xl rounded-2xl z-30 flex flex-col border border-white/20 shadow-2xl overflow-hidden">
                        <div class="h-8 w-full bg-black/30 cursor-move flex items-center justify-center active:bg-black/40 transition-colors" id="blocker-handle">
                            <div class="w-12 h-1 bg-white/40 rounded-full"></div>
                        </div>
                        <div class="flex-1 flex items-center justify-center text-white/50 text-xs font-bold pointer-events-none select-none px-4 text-center">
                            拖动顶栏移动<br>拖动右下角缩放
                        </div>
                        <div id="blocker-resize" class="absolute bottom-0 right-0 w-8 h-8 cursor-nwse-resize flex items-end justify-end p-2 opacity-50 active:opacity-100 touch-none">
                            <i class="ph-bold ph-corners-out text-white transform rotate-90"></i>
                        </div>
                    </div>

                    <button onclick="openFullscreenImage()" class="absolute top-4 right-4 w-10 h-10 bg-black/40 backdrop-blur-md text-white rounded-xl flex items-center justify-center active:scale-90 z-20 hover:bg-black/50 transition">
                        <i class="ph-bold ph-arrows-out text-lg"></i>
                    </button>
                </div>
                
                <div class="flex justify-between gap-3 w-full pb-2 z-20">
                    <button onclick="handleReview('again')" class="flex-1 py-3.5 rounded-2xl font-bold text-base transition-all active:scale-95 flex flex-col items-center shadow-sm" style="background: var(--color-btn-1); color: var(--color-btn-1-text);">
                        <span id="hint-again" class="text-[10px] font-bold opacity-80 mb-0.5">&lt;1天</span>
                        <span>重来</span>
                    </button>
                    <button onclick="handleReview('hard')" class="flex-1 py-3.5 rounded-2xl font-bold text-base transition-all active:scale-95 flex flex-col items-center shadow-sm" style="background: var(--color-btn-2); color: var(--color-btn-2-text);">
                        <span id="hint-hard" class="text-[10px] font-bold opacity-80 mb-0.5">--</span>
                        <span>困难</span>
                    </button>
                    <button onclick="handleReview('good')" class="flex-1 py-3.5 rounded-2xl font-bold text-base transition-all active:scale-95 flex flex-col items-center shadow-sm" style="background: var(--color-btn-3); color: var(--color-btn-3-text);">
                        <span id="hint-good" class="text-[10px] font-bold opacity-90 mb-0.5">--</span>
                        <span>良好</span>
                    </button>
                    <button onclick="handleReview('easy')" class="flex-1 py-3.5 rounded-2xl font-bold text-base transition-all active:scale-95 flex flex-col items-center shadow-sm" style="background: var(--color-btn-4); color: var(--color-btn-4-text);">
                        <span id="hint-easy" class="text-[10px] font-bold opacity-90 mb-0.5">--</span>
                        <span>简单</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab 2: 录入错题 (Upload) -->
        <div id="tab-upload" class="hidden min-h-full flex flex-col fade-in max-w-lg mx-auto pt-2 pb-4">
            <div class="card-shadow rounded-3xl p-6 md:p-8 flex flex-col gap-6">
                <label class="w-full border-2 border-dashed rounded-[2rem] min-h-[16rem] p-4 flex flex-col items-center justify-center cursor-pointer transition-all hover:opacity-80 relative group" style="border-color: var(--color-primary); background: var(--color-primary-light)">
                    <input type="file" accept="image/*" id="upload-input" multiple onchange="handleImageSelect(event)" class="hidden">
                    
                    <div id="upload-placeholder" class="flex flex-col items-center gap-4 z-0 transition-opacity">
                        <div class="w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl shadow-sm flex items-center justify-center group-hover:scale-105 transition-transform">
                            <i class="ph-bold ph-images text-3xl theme-text"></i>
                        </div>
                        <span class="font-bold text-sm theme-text">点击拍照或选择多张图片</span>
                    </div>
                    
                    <div id="upload-preview-container" class="w-full hidden grid grid-cols-2 md:grid-cols-3 gap-3 z-10">
                        <!-- Previews will be injected here -->
                    </div>
                </label>
                
                <div>
                    <div class="flex justify-between items-center mb-4 px-1">
                        <h3 class="text-sm font-bold text-textMain flex items-center gap-2">
                            <i class="ph-bold ph-tag theme-text"></i> 考点标签 
                            <span class="text-textMuted font-normal text-xs">(多选)</span>
                        </h3>
                        <button onclick="openModal('tag-modal')" class="text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 active:scale-95 transition-colors" style="background: var(--color-primary-light); color: var(--color-primary)">
                            <i class="ph-bold ph-gear"></i> 管理
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2" id="upload-tags-container"></div>
                </div>
                
                <button onclick="submitUpload()" class="w-full font-bold py-4 rounded-2xl active:scale-95 transition-transform flex items-center justify-center gap-2 mt-2 shadow-md theme-bg">
                    <i class="ph-bold ph-check-circle text-lg"></i> 确认录入错题
                </button>
            </div>
        </div>

        <!-- Tab 3: 错题库 (Gallery) -->
        <div id="tab-gallery" class="hidden min-h-full fade-in flex flex-col max-w-5xl mx-auto pt-2 pb-4">
            <div class="w-full overflow-x-auto no-scrollbar py-2 mb-3 whitespace-nowrap -mx-2 px-2 md:-mx-0 md:px-0">
                <div class="flex gap-2" id="filter-tags-container"></div>
                <div class="text-[10px] text-textMuted mt-1 ml-2 flex items-center gap-1">
                    <i class="ph-fill ph-hand-swipe-right"></i> 长按标签可拖拽排序
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="gallery-grid"></div>
        </div>

        <!-- Tab 4: 数据统计 (Stats) -->
        <div id="tab-stats" class="hidden min-h-full flex flex-col fade-in max-w-4xl mx-auto w-full pt-2 pb-4">
            <div class="grid grid-cols-2 gap-4 mb-5">
                <div class="card-shadow p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden transition-colors">
                    <span class="text-4xl font-extrabold mb-1 theme-text" id="stat-days">0</span>
                    <span class="text-[11px] font-bold text-textMuted uppercase tracking-wider">累计学习 (天)</span>
                </div>
                <div class="card-shadow p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden transition-colors">
                    <span class="text-4xl font-extrabold mb-1 theme-text" id="stat-total">0</span>
                    <span class="text-[11px] font-bold text-textMuted uppercase tracking-wider">总错题数</span>
                </div>
                <div class="card-shadow p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden transition-colors">
                    <span class="text-4xl font-extrabold mb-1 theme-text" id="stat-today">0</span>
                    <span class="text-[11px] font-bold text-textMuted uppercase tracking-wider">今日待复习</span>
                </div>
                <div class="card-shadow p-6 rounded-3xl flex flex-col items-center justify-center relative overflow-hidden transition-colors">
                    <span class="text-4xl font-extrabold mb-1 theme-text" id="stat-tomorrow">0</span>
                    <span class="text-[11px] font-bold text-textMuted uppercase tracking-wider">明日待复习</span>
                </div>
            </div>
            
            <div class="card-shadow p-6 rounded-3xl flex-1 flex flex-col min-h-[300px] transition-colors mb-5">
                <h3 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i class="ph-bold ph-trend-up theme-text"></i> 
                    <span class="theme-text">预测遗忘曲线 (未来7天)</span>
                </h3>
                <div class="flex-1 w-full relative">
                    <canvas id="forgetting-chart"></canvas>
                </div>
            </div>
        </div>

    </main>

    <!-- 导航栏使用 pt-2 pb-safe 动态撑开高度 -->
    <nav class="absolute bottom-0 left-0 right-0 w-full flex items-center justify-around px-2 pt-2 pb-safe z-40 transition-colors duration-300" style="background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--color-border);">
        <button id="nav-review" onclick="switchTab('review')" class="flex flex-col items-center justify-center flex-1 text-textMuted transition-colors py-2 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 mx-1">
            <i class="ph-bold ph-cards text-[24px] mb-1 nav-icon"></i>
            <span class="text-[10px] font-bold">复习</span>
        </button>
        <button id="nav-upload" onclick="switchTab('upload')" class="flex flex-col items-center justify-center flex-1 text-textMuted transition-colors py-2 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 mx-1">
            <i class="ph-bold ph-plus-circle text-[24px] mb-1 nav-icon"></i>
            <span class="text-[10px] font-bold">录入</span>
        </button>
        <button id="nav-gallery" onclick="switchTab('gallery')" class="flex flex-col items-center justify-center flex-1 text-textMuted transition-colors py-2 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 mx-1">
            <i class="ph-bold ph-squares-four text-[24px] mb-1 nav-icon"></i>
            <span class="text-[10px] font-bold">错题库</span>
        </button>
        <button id="nav-stats" onclick="switchTab('stats')" class="flex flex-col items-center justify-center flex-1 text-textMuted transition-colors py-2 rounded-2xl hover:bg-black/5 dark:hover:bg-white/5 mx-1">
            <i class="ph-bold ph-chart-line-up text-[24px] mb-1 nav-icon"></i>
            <span class="text-[10px] font-bold">统计</span>
        </button>
    </nav>
    
    <!-- 全屏图片查看器 -->
    <div id="fullscreen-modal" class="fixed inset-0 z-[60] hidden bg-black/95 flex flex-col transition-opacity opacity-0" onclick="closeFullscreenImage()">
        <!-- ... -->
        <div class="absolute top-12 right-6 z-10">
            <button class="w-12 h-12 bg-white/20 backdrop-blur-md rounded-2xl text-white flex items-center justify-center active:scale-90">
                <i class="ph-bold ph-x text-xl"></i>
            </button>
        </div>
        <div class="flex-1 w-full h-full p-2 flex items-center justify-center">
            <img id="fullscreen-img" src="" class="max-w-full max-h-full object-contain touch-zoom rounded-2xl">
        </div>
    </div>

    <!-- 弹窗: 编辑错题标签 -->
    <div id="edit-item-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity opacity-0" id="edit-item-modal-bg" onclick="closeModal('edit-item-modal')"></div>
        <div class="absolute bottom-0 w-full card-shadow rounded-t-[2rem] p-6 md:p-8 pb-safe transition-transform transform translate-y-full flex flex-col gap-6 max-h-[85vh]" id="edit-item-modal-content">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">编辑错题</h2>
                <button onclick="closeModal('edit-item-modal')" class="w-10 h-10 bg-black/5 dark:bg-white/10 rounded-2xl flex items-center justify-center active:scale-90"><i class="ph-bold ph-x"></i></button>
            </div>
            
            <div class="h-40 bg-black/5 dark:bg-white/5 rounded-3xl flex items-center justify-center overflow-hidden border border-borderMain p-2">
                 <img id="edit-item-preview" src="" class="h-full object-contain rounded-2xl">
            </div>
            
            <div class="flex-1 overflow-y-auto no-scrollbar">
                <h3 class="text-xs font-bold text-textMuted mb-3 uppercase tracking-wider">修改标签</h3>
                <div class="flex flex-wrap gap-2" id="edit-item-tags-container"></div>
            </div>
            
            <button onclick="saveEditItem()" class="w-full font-bold py-4 rounded-2xl active:scale-95 transition-transform mt-2 shadow-md theme-bg">
                保存修改
            </button>
        </div>
    </div>

    <!-- 弹窗: 提示 (Toast) -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-textMain text-panel px-6 py-3 rounded-full shadow-2xl text-sm font-bold transition-all duration-300 opacity-0 hidden z-50 pointer-events-none flex items-center gap-2">
        <span id="toast-msg"></span>
    </div>

    <!-- 模态框: 全局管理标签 -->
    <div id="tag-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity opacity-0" id="tag-modal-bg" onclick="closeModal('tag-modal')"></div>
        <div class="absolute bottom-0 w-full card-shadow rounded-t-[2rem] p-6 md:p-8 pb-safe transition-transform transform translate-y-full flex flex-col gap-6" id="tag-modal-content">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">考点标签管理</h2>
                <button onclick="closeModal('tag-modal')" class="w-10 h-10 bg-black/5 dark:bg-white/10 rounded-2xl flex items-center justify-center active:scale-90"><i class="ph-bold ph-x"></i></button>
            </div>
            <div class="flex gap-3">
                <input type="text" id="new-tag-input" placeholder="输入新标签..." class="flex-1 bg-black/5 dark:bg-white/5 border border-borderMain rounded-2xl px-5 py-3 font-medium outline-none focus:border-gray-400 text-sm">
                <button onclick="addNewTag()" class="font-bold px-6 py-3 rounded-2xl active:scale-95 transition-transform shadow-md theme-bg">添加</button>
            </div>
            <div class="overflow-y-auto max-h-64 no-scrollbar">
                <h3 class="text-xs font-bold text-textMuted mb-3 uppercase tracking-wider">已有标签 (点击删除)</h3>
                <div class="flex flex-wrap gap-2" id="manage-tags-list"></div>
            </div>
        </div>
    </div>

    <!-- 模态框: 主题与自定义颜色设置 -->
    <div id="theme-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity opacity-0" id="theme-modal-bg" onclick="closeModal('theme-modal')"></div>
        <div class="absolute bottom-0 w-full card-shadow rounded-t-[2rem] p-6 md:p-8 pb-safe transition-transform transform translate-y-full flex flex-col gap-6 max-h-[90vh] overflow-y-auto no-scrollbar" id="theme-modal-content">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">界面设置</h2>
                <button onclick="closeModal('theme-modal')" class="w-10 h-10 bg-black/5 dark:bg-white/10 rounded-2xl flex items-center justify-center active:scale-90"><i class="ph-bold ph-x"></i></button>
            </div>
            
            <div>
                <h3 class="text-xs font-bold text-textMuted mb-3 uppercase tracking-wider">外观模式</h3>
                <div class="flex p-1.5 bg-black/5 dark:bg-white/10 rounded-2xl">
                    <button onclick="setThemeMode('light')" id="btn-theme-light" class="flex-1 py-2.5 font-bold text-sm rounded-xl transition-all">明亮</button>
                    <button onclick="setThemeMode('dark')" id="btn-theme-dark" class="flex-1 py-2.5 font-bold text-sm rounded-xl transition-all">暗黑</button>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-textMuted mb-3 uppercase tracking-wider">主题配色</h3>
                <div class="flex flex-wrap gap-4 py-2" id="theme-colors-container">
                    <!-- JS 生成颜色选择按钮 -->
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-textMuted mb-3 uppercase tracking-wider">添加自定义主题</h3>
                <div class="flex flex-col gap-3">
                    <div class="flex gap-2">
                        <input type="text" id="custom-hex-input" placeholder="纯色 (如 #FF5733)" class="flex-1 bg-black/5 dark:bg-white/5 border border-borderMain rounded-xl px-4 py-2.5 font-medium outline-none text-sm uppercase font-mono">
                        <button onclick="addCustomTheme('solid')" class="font-bold px-4 py-2.5 rounded-xl active:scale-95 transition-transform shadow-md theme-bg whitespace-nowrap text-sm">加纯色</button>
                    </div>
                    <div class="flex gap-2 items-center">
                        <input type="text" id="custom-grad-1" placeholder="渐变起 (#FF9A9E)" class="flex-1 w-0 bg-black/5 dark:bg-white/5 border border-borderMain rounded-xl px-3 py-2.5 font-medium outline-none text-[11px] uppercase font-mono">
                        <span class="text-textMuted text-xs">-</span>
                        <input type="text" id="custom-grad-2" placeholder="渐变止 (#FECFEF)" class="flex-1 w-0 bg-black/5 dark:bg-white/5 border border-borderMain rounded-xl px-3 py-2.5 font-medium outline-none text-[11px] uppercase font-mono">
                        <button onclick="addCustomTheme('gradient')" class="font-bold px-4 py-2.5 rounded-xl active:scale-95 transition-transform shadow-md theme-bg whitespace-nowrap text-sm">加渐变</button>

    <script>
        const DB_QUESTIONS = 'anki_pro_questions';

        const DB_FIRST_USE = 'anki_pro_first_use';

        let questions = [];
        let allTags = ['行测', '申论', '言语理解', '数量关系'];
        
        const DEFAULT_COLORS = [
            '#C8D986', // Mint Green

            ['#a18cd1', '#fbc2eb'], // Lavender Gradient

        let galleryFilterSortable = null;

        async function initApp() {
            const savedTags = await localforage.getItem(DB_TAGS);
            if (savedTags && Array.isArray(savedTags)) allTags = savedTags;
            
            const savedSettings = await localforage.getItem(DB_SETTINGS);

            const savedQuestions = await localforage.getItem(DB_QUESTIONS);

        function switchTab(tabId) {

            if (tabId === 'review') loadReviewQueue();

        function hexToRgb(hex) {
            if (hex.length === 4) {
                return { r: parseInt(hex[1]+hex[1], 16), g: parseInt(hex[2]+hex[2], 16), b: parseInt(hex[3]+hex[3], 16) };
            }
            return { r: parseInt(hex.substring(1, 3), 16), g: parseInt(hex.substring(3, 5), 16), b: parseInt(hex.substring(5, 7), 16) };
        }

        function hexToHSL(hex) {
            let {r, g, b} = hexToRgb(hex);
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) h = s = 0; 
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function getContrastText(hex) {
            let {r, g, b} = hexToRgb(hex);
            let yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return yiq >= 160 ? '#4A4A4A' : '#FFFFFF';
        }

        function getLightTintRGB(hex, factor = 0.95) {
            const {r, g, b} = hexToRgb(hex);
            return `${Math.round(r + (255 - r) * factor)}, ${Math.round(g + (255 - g) * factor)}, ${Math.round(b + (255 - b) * factor)}`;
        }

        function getDarkShadeRGB(hex, factor = 0.92) {
            const {r, g, b} = hexToRgb(hex);
            return `${Math.round(r * (1 - factor))}, ${Math.round(g * (1 - factor))}, ${Math.round(b * (1 - factor))}`;
        }

        function generateMonochromaticPalette(hex) {
            let {h, s, l} = hexToHSL(hex);
            let l1, l2, l3, l4;
            if (settings.mode === 'dark') {
                l1 = Math.max(15, l - 30);
                l2 = Math.max(25, l - 15);
                l3 = l;
                l4 = Math.min(95, l + 15);
            } else {
                l1 = Math.min(96, l + 25);
                l2 = Math.min(88, l + 12);
                l3 = l;
                l4 = Math.max(20, l - 15);
            }
            return [hslToHex(h, s, l1), hslToHex(h, s, l2), hslToHex(h, s, l3), hslToHex(h, s, l4)];
        }

        function applySettings() {
            const html = document.documentElement;
            const isGradient = Array.isArray(settings.color);
            const c1 = isGradient ? settings.color[0] : settings.color;
            const c2 = isGradient ? settings.color[1] : settings.color;
            
            if (settings.mode === 'dark') {
                html.classList.add('dark');
                html.style.setProperty('--glass-bg', 'rgba(18, 18, 18, 0.85)');
                html.style.setProperty('--color-panel', `rgb(${getDarkShadeRGB(c1, 0.88)})`);
                
                if (isGradient) {
                    html.style.setProperty('--bg-main-fill', `linear-gradient(135deg, rgb(${getDarkShadeRGB(c1, 0.8)}), rgb(${getDarkShadeRGB(c2, 0.8)}))`);
                } else {
                    html.style.setProperty('--bg-main-fill', `rgb(${getDarkShadeRGB(c1, 0.94)})`);
                }
            } else {
                html.classList.remove('dark');
                html.style.setProperty('--glass-bg', 'rgba(255, 255, 255, 0.85)');
                html.style.setProperty('--color-panel', '#FFFFFF');
                
                if (isGradient) {
                    html.style.setProperty('--bg-main-fill', `linear-gradient(135deg, ${c1}, ${c2})`);
                } else {
                    let bgStr = (c1.toLowerCase() === '#111111' || c1.toLowerCase() === '#000000') ? '#FAFAFA' : `rgb(${getLightTintRGB(c1, 0.92)})`;
                    html.style.setProperty('--bg-main-fill', bgStr);
                }
            }
            
            html.style.setProperty('--color-primary', c1);
            html.style.setProperty('--color-primary-text', getContrastText(c1));
            html.style.setProperty('--color-primary-light', c1 + '25');
            
            const [btn1, btn2, btn3, btn4] = generateMonochromaticPalette(c1);
            html.style.setProperty('--color-btn-1', btn1);
            html.style.setProperty('--color-btn-2', btn2);
            html.style.setProperty('--color-btn-3', btn3);
            html.style.setProperty('--color-btn-4', btn4);
            
            html.style.setProperty('--color-btn-1-text', getContrastText(btn1));
            html.style.setProperty('--color-btn-2-text', getContrastText(btn2));
            html.style.setProperty('--color-btn-3-text', getContrastText(btn3));
            html.style.setProperty('--color-btn-4-text', getContrastText(btn4));
            
            document.getElementById('btn-theme-light').className = `flex-1 py-2.5 font-bold text-sm rounded-xl transition-all ${settings.mode === 'light' ? 'bg-white text-black shadow-sm' : 'text-textMuted hover:bg-black/5'}`;
            document.getElementById('btn-theme-dark').className = `flex-1 py-2.5 font-bold text-sm rounded-xl transition-all ${settings.mode === 'dark' ? 'bg-[#333] text-white shadow-sm' : 'text-textMuted hover:bg-white/5'}`;
            
            renderThemeColors();
            
            if(currentTab) {
                document.getElementById(`nav-${currentTab}`).style.color = 'var(--color-primary)';
                document.getElementById(`nav-${currentTab}`).style.background = 'var(--color-primary-light)';
            }
            if(currentTab === 'stats') renderStats();
        }

        function setThemeMode(mode) {
            settings.mode = mode;
            localforage.setItem(DB_SETTINGS, settings);
            applySettings();
        }

        function setThemeColor(jsonStr) {
            settings.color = JSON.parse(decodeURIComponent(jsonStr));
            localforage.setItem(DB_SETTINGS, settings);
            applySettings();
        }

        function renderThemeColors() {
            const container = document.getElementById('theme-colors-container');
            const displayColors = [...DEFAULT_COLORS, ...settings.customColors];
            
            container.innerHTML = displayColors.map(colorObj => {
                const isCustom = settings.customColors.some(c => JSON.stringify(c) === JSON.stringify(colorObj));
                const isSelected = JSON.stringify(settings.color) === JSON.stringify(colorObj);
                const bgStr = Array.isArray(colorObj) ? `linear-gradient(135deg, ${colorObj[0]}, ${colorObj[1]})` : colorObj;
                
                const ringClass = isSelected ? `ring-2 ring-offset-2 ring-textMain scale-110` : 'hover:scale-110';
                const jsonStr = encodeURIComponent(JSON.stringify(colorObj));
                
                const delBtn = isCustom ? `<button onclick="event.stopPropagation(); deleteCustomColor('${jsonStr}')" class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 rounded-full text-white flex items-center justify-center text-[10px] shadow-sm active:scale-90 z-10"><i class="ph-bold ph-x"></i></button>` : '';
                
                return `
                <div class="relative mt-1 mr-1">
                    <button onclick="setThemeColor('${jsonStr}')" class="w-10 h-10 rounded-full transition-all ${ringClass} shadow-sm" style="background: ${bgStr}"></button>
                    ${delBtn}
                </div>`;
            }).join('');
        }

        function isValidHex(hex) {
            return /^#[0-9A-F]{6}$/i.test(hex) || /^#[0-9A-F]{3}$/i.test(hex);
        }

        function formatHex(hex) {
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (/^#[0-9A-F]{3}$/i.test(hex)) {
                hex = '#' + hex[1]+hex[1] + hex[2]+hex[2] + hex[3]+hex[3];
            }
            return hex.toUpperCase();
        }

        async function addCustomTheme(type) {
            let newColor = null;
            if (type === 'solid') {
                const input = document.getElementById('custom-hex-input');
                let hex = input.value.trim();
                if(!hex) return;
                hex = formatHex(hex);
                if (isValidHex(hex)) {
                    newColor = hex;
                    input.value = '';
                } else {
                    showToast('请输入正确的纯色 HEX 色号');
                    return;
                }
            } else if (type === 'gradient') {
                const input1 = document.getElementById('custom-grad-1');
                const input2 = document.getElementById('custom-grad-2');
                let hex1 = formatHex(input1.value.trim());
                let hex2 = formatHex(input2.value.trim());
                
                if (isValidHex(hex1) && isValidHex(hex2)) {
                    newColor = [hex1, hex2];
                    input1.value = '';
                    input2.value = '';
                } else {
                    showToast('请输入正确的渐变色 HEX 色号');
                    return;
                }
            }
            
            if (newColor) {
                const isExist = [...DEFAULT_COLORS, ...settings.customColors].some(c => JSON.stringify(c) === JSON.stringify(newColor));
                if (!isExist) settings.customColors.push(newColor);
                settings.color = newColor;
                await localforage.setItem(DB_SETTINGS, settings);
                applySettings();
            }
        }

        async function deleteCustomColor(jsonStr) {
            if(confirm('确定删除该自定义主题吗？')) {
                const colorObj = JSON.parse(decodeURIComponent(jsonStr));
                settings.customColors = settings.customColors.filter(c => JSON.stringify(c) !== JSON.stringify(colorObj));
                if(JSON.stringify(settings.color) === JSON.stringify(colorObj)) {
                    settings.color = DEFAULT_COLORS[0];
                }
                await localforage.setItem(DB_SETTINGS, settings);
                applySettings();
            }
        }

        async function renderStats() {
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const todayEnd = todayStart + MS_PER_DAY - 1;
            const tomorrowEnd = todayEnd + MS_PER_DAY;
            
            const total = questions.length;
            const todayCount = questions.filter(q => q.nextReview <= todayEnd).length;
            const tomorrowCount = questions.filter(q => q.nextReview > todayEnd && q.nextReview <= tomorrowEnd).length;
            
            const firstUse = await localforage.getItem(DB_FIRST_USE) || Date.now();
            const days = Math.max(1, Math.ceil((Date.now() - firstUse + 1) / MS_PER_DAY));
            
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-today').innerText = todayCount;
            document.getElementById('stat-tomorrow').innerText = tomorrowCount;
            document.getElementById('stat-days').innerText = days;
            
            let labels = [];
            let dataCounts = [];
            
            for(let i = 0; i < 7; i++) {
                let targetStart = todayStart + i * MS_PER_DAY;
                let targetEnd = targetStart + MS_PER_DAY - 1;
                
                if (i === 0) {
                    labels.push('今天');
                    dataCounts.push(questions.filter(q => q.nextReview <= targetEnd).length);
                } else if (i === 1) {
                    labels.push('明天');
                    dataCounts.push(questions.filter(q => q.nextReview > targetStart - 1 && q.nextReview <= targetEnd).length);
                } else {
                    let d = new Date(targetStart);
                    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
                    dataCounts.push(questions.filter(q => q.nextReview > targetStart - 1 && q.nextReview <= targetEnd).length);
                }
            }

            const ctx = document.getElementById('forgetting-chart').getContext('2d');
            if (learningChart) learningChart.destroy();
            
            const isGradient = Array.isArray(settings.color);
            const cBase = isGradient ? settings.color[0] : settings.color;
            
            const gradientFill = ctx.createLinearGradient(0, 0, 0, 300);
            gradientFill.addColorStop(0, cBase + '80'); 
            gradientFill.addColorStop(1, cBase + '00'); 
            
            learningChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '待复习题量',
                        data: dataCounts,
                        backgroundColor: gradientFill,
                        borderColor: cBase,
                        borderWidth: 4,
                        tension: 0.5,
                        fill: true,
                        pointBackgroundColor: '#FFFFFF',
                        pointBorderColor: cBase,
                        pointBorderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false } 
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            border: { display: false },
                            ticks: { stepSize: 1, color: '#9CA3AF', font: { family: 'sans-serif', size: 10 } },
                            grid: { color: 'rgba(0,0,0,0.03)' }
                        },
                        x: { 
                            border: { display: false },
                            grid: { display: false },
                            ticks: { color: '#9CA3AF', font: { family: 'sans-serif', size: 11 } }
                        }
                    }
                }
            });
        }

        async function handleImageSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            uploadImagesBase64 = [];
            const container = document.getElementById('upload-preview-container');
            container.innerHTML = '';
            
            for (let i = 0; i < files.length; i++) {
                const dataUrl = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(files[i]);
                });
                uploadImagesBase64.push(dataUrl);
                
                const div = document.createElement('div');
                div.className = 'w-full aspect-square rounded-2xl overflow-hidden bg-black/5 border border-black/5 dark:border-white/10';
                const img = document.createElement('img');
                img.src = dataUrl;
                img.className = 'w-full h-full object-cover';
                div.appendChild(img);
                container.appendChild(div);
            }
            
            container.classList.remove('hidden');
            document.getElementById('upload-placeholder').classList.add('hidden');
        }

        function renderUploadTags() {
            const container = document.getElementById('upload-tags-container');
            container.innerHTML = allTags.map(tag => {
                const isSelected = selectedUploadTags.includes(tag);
                const bg = isSelected ? 'var(--color-primary)' : 'var(--color-border)';
                const col = isSelected ? 'var(--color-primary-text)' : 'var(--color-text-muted)';
                return `<button onclick="toggleUploadTag('${tag}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-transform active:scale-95 shadow-sm" style="background: ${bg}; color: ${col}">${tag}</button>`;
            }).join('');
        }

        function toggleUploadTag(tag) {
            if (selectedUploadTags.includes(tag)) {
                selectedUploadTags = selectedUploadTags.filter(t => t !== tag);
            } else {
                selectedUploadTags.push(tag);
            }
            renderUploadTags();
        }

        async function submitUpload() {
            if (uploadImagesBase64.length === 0) {
                showToast('请先选择或拍摄错题图片');
                return;
            }

            const now = Date.now();
            let count = 0;
            
            // 倒序插入，保证先选的图片在前面
            for (let i = uploadImagesBase64.length - 1; i >= 0; i--) {
                const newQuestion = {
                    id: 'q_' + now + '_' + i,
                    imageBase64: uploadImagesBase64[i],
                    tags: [...selectedUploadTags],
                    interval: 0,
                    ease_factor: 2.5,
                    repetitions: 0,
                    nextReview: now, 
                    createdAt: now
                };
                questions.unshift(newQuestion);
                count++;
            }
            
            await localforage.setItem(DB_QUESTIONS, questions);
            
            showToast(`✅ 成功录入 ${count} 道错题！`);
            
            uploadImagesBase64 = [];
            selectedUploadTags = [];
            
            const container = document.getElementById('upload-preview-container');
            container.innerHTML = '';
            container.classList.add('hidden');
            
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('upload-input').value = '';
            renderUploadTags();
        }

        const blocker = document.getElementById('answer-blocker');
        const blockerHandle = document.getElementById('blocker-handle');
        const blockerResize = document.getElementById('blocker-resize');

        let bDragging = false;
        let bResizing = false;
        let bStartX = 0, bStartY = 0;
        let bInitialLeft = 0, bInitialTop = 0;
        let bInitialWidth = 0, bInitialHeight = 0;

        function toggleBlocker() {
            if (blocker.classList.contains('hidden')) {
                blocker.classList.remove('hidden');
                blocker.style.left = '30px';
                blocker.style.top = '100px';
                blocker.style.width = '200px';
                blocker.style.height = '100px';
            } else {
                blocker.classList.add('hidden');
            }
        }

        blockerHandle.addEventListener('mousedown', startDrag);
        blockerHandle.addEventListener('touchstart', startDrag, {passive: false});
        document.addEventListener('mousemove', handleDrag);
        document.addEventListener('touchmove', handleDrag, {passive: false});
        document.addEventListener('mouseup', stopDragAndResize);
        document.addEventListener('touchend', stopDragAndResize);

        blockerResize.addEventListener('mousedown', startResize);
        blockerResize.addEventListener('touchstart', startResize, {passive: false});
        document.addEventListener('mousemove', handleResize);
        document.addEventListener('touchmove', handleResize, {passive: false});

        function startDrag(e) {
            bDragging = true;
            const evt = e.touches ? e.touches[0] : e;
            bStartX = evt.clientX;
            bStartY = evt.clientY;
            const style = window.getComputedStyle(blocker);
            bInitialLeft = parseInt(style.left, 10) || 0;
            bInitialTop = parseInt(style.top, 10) || 0;
            if(e.touches) e.preventDefault(); 
        }

        function handleDrag(e) {
            if (!bDragging) return;
            if(e.touches && e.cancelable) e.preventDefault();
            const evt = e.touches ? e.touches[0] : e;
            const dx = evt.clientX - bStartX;
            const dy = evt.clientY - bStartY;
            blocker.style.left = (bInitialLeft + dx) + 'px';
            blocker.style.top = (bInitialTop + dy) + 'px';
        }

        function startResize(e) {
            e.stopPropagation();
            bResizing = true;
            const evt = e.touches ? e.touches[0] : e;
            bStartX = evt.clientX;
            bStartY = evt.clientY;
            const style = window.getComputedStyle(blocker);
            bInitialWidth = parseInt(style.width, 10) || 0;
            bInitialHeight = parseInt(style.height, 10) || 0;
            if(e.touches) e.preventDefault();
        }

        function handleResize(e) {
            if (!bResizing) return;
            if(e.touches && e.cancelable) e.preventDefault();
            const evt = e.touches ? e.touches[0] : e;
            const dx = evt.clientX - bStartX;
            const dy = evt.clientY - bStartY;
            blocker.style.width = Math.max(100, bInitialWidth + dx) + 'px';
            blocker.style.height = Math.max(60, bInitialHeight + dy) + 'px';
        }

        function stopDragAndResize() { bDragging = false; bResizing = false; }

        function openFullscreenImage() {
            if (currentReviewIndex >= reviewQueue.length) return;
            const q = reviewQueue[currentReviewIndex];
            document.getElementById('fullscreen-img').src = q.imageBase64;
            const modal = document.getElementById('fullscreen-modal');
            modal.classList.remove('hidden');
            requestAnimationFrame(() => modal.classList.remove('opacity-0'));
        }

        function closeFullscreenImage() {
            const modal = document.getElementById('fullscreen-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function loadReviewQueue() {
            const todayStart = new Date().setHours(23, 59, 59, 999);
            reviewQueue = questions.filter(q => q.nextReview <= todayStart);
            currentReviewIndex = 0;
            renderCurrentReview();
        }

        function renderCurrentReview() {
            if (currentReviewIndex >= reviewQueue.length) {
                document.getElementById('review-content').classList.add('hidden');
                document.getElementById('review-empty').classList.remove('hidden');
                return;
            }
            document.getElementById('review-empty').classList.add('hidden');
            document.getElementById('review-content').classList.remove('hidden');
            
            const q = reviewQueue[currentReviewIndex];
            const img = document.getElementById('review-image');
            img.style.opacity = '0'; 
            
            setTimeout(() => {
                img.src = q.imageBase64;
                img.style.opacity = '1';
            }, 100);

            document.getElementById('review-progress').innerText = `进度: ${currentReviewIndex + 1} / ${reviewQueue.length}`;
            updateReviewPredictions(q);
        }

        function updateReviewPredictions(q) {
            const { interval, ease_factor } = q;
            const nextHard = interval === 0 ? 2 : Math.round(interval * 1.2);
            const nextGood = interval === 0 ? 3 : Math.round(interval * ease_factor);
            const nextEasy = interval === 0 ? 4 : Math.round(interval * ease_factor * 1.3);
            
            document.getElementById('hint-again').innerText = '<1天';
            document.getElementById('hint-hard').innerText = `${nextHard}天`;
            document.getElementById('hint-good').innerText = `${nextGood}天`;
            document.getElementById('hint-easy').innerText = `${nextEasy}天`;
        }

        async function handleReview(rating) {
            if(currentReviewIndex >= reviewQueue.length) return;
            
            let q = reviewQueue[currentReviewIndex];
            let { interval, ease_factor, repetitions } = q;
            let nextInterval = 0;
            
            if (rating === 'again') {
                nextInterval = 1;
                ease_factor = Math.max(1.3, ease_factor - 0.2);
                repetitions = 0;
            } else if (rating === 'hard') {
                nextInterval = interval === 0 ? 2 : Math.round(interval * 1.2);
                ease_factor = Math.max(1.3, ease_factor - 0.15);
                repetitions += 1;
            } else if (rating === 'good') {
                nextInterval = interval === 0 ? 3 : Math.round(interval * ease_factor);
                repetitions += 1;
            } else if (rating === 'easy') {
                nextInterval = interval === 0 ? 4 : Math.round(interval * ease_factor * 1.3);
                ease_factor += 0.15;
                repetitions += 1;
            }
            
            q.interval = nextInterval;
            q.ease_factor = ease_factor;
            q.repetitions = repetitions;
            
            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + nextInterval);
            q.nextReview = nextDate.getTime();
            
            const idx = questions.findIndex(x => x.id === q.id);
            if(idx > -1) questions[idx] = q;
            await localforage.setItem(DB_QUESTIONS, questions);
            
            showToast(`已排期：${nextInterval} 天后复习`);
            
            currentReviewIndex++;
            renderCurrentReview();
        }

        let currentFilter = '全部';
        function renderGalleryFilters() {
            const container = document.getElementById('filter-tags-container');
            
            let html = `<button onclick="renderGallery('全部')" class="filter-tag-fixed px-5 py-2.5 rounded-2xl text-xs font-bold transition-transform active:scale-95 border shadow-sm ${currentFilter === '全部' ? 'border-transparent' : 'border-borderMain'}" style="background: ${currentFilter === '全部' ? 'var(--color-primary)' : 'var(--color-panel)'}; color: ${currentFilter === '全部' ? 'var(--color-primary-text)' : 'var(--color-text-main)'};">全部</button>`;
            
            html += allTags.map(tag => {
                const isActive = tag === currentFilter;
                const bg = isActive ? 'var(--color-primary)' : 'var(--color-panel)';
                const col = isActive ? 'var(--color-primary-text)' : 'var(--color-text-main)';
                const border = isActive ? 'border-transparent' : 'border-borderMain';
                return `<button data-id="${tag}" onclick="renderGallery('${tag}')" class="filter-tag-item px-5 py-2.5 rounded-2xl text-xs font-bold transition-transform active:scale-95 border shadow-sm ${border}" style="background: ${bg}; color: ${col}; cursor: grab">${tag}</button>`;
            }).join('');
            
            container.innerHTML = html;

            if (!galleryFilterSortable && typeof Sortable !== 'undefined') {
                try {
                    galleryFilterSortable = new Sortable(container, {
                        animation: 150,
                        filter: '.filter-tag-fixed',
                        draggable: '.filter-tag-item',
                        delay: 200, 
                        delayOnTouchOnly: true,
                        ghostClass: 'sortable-ghost',
                        onEnd: async function () {
                            const newOrder = Array.from(container.children)
                                .filter(el => el.classList.contains('filter-tag-item'))
                                .map(el => el.getAttribute('data-id'));
                            
                            allTags = newOrder;
                            await localforage.setItem(DB_TAGS, allTags);
                            renderManageTags();
                            renderUploadTags();
                        }
                    });
                } catch (e) {
                    console.error('Sortable init error:', e);
                }
            }
        }

        function renderGallery(filterTag) {
            currentFilter = filterTag;
            renderGalleryFilters(); 
            
            const gallery = document.getElementById('gallery-grid');
            const filteredData = filterTag === '全部' 
                ? questions 
                : questions.filter(item => item.tags.includes(filterTag));
                
            let html = '';
            filteredData.forEach(item => {
                const tagHtml = item.tags.map(t => `<span class="bg-black/60 backdrop-blur-md text-white px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap shadow-sm">${t}</span>`).join('');
                
                const dateObj = new Date(item.nextReview);
                const isToday = dateObj.setHours(0,0,0,0) <= new Date().setHours(0,0,0,0);
                const dateStr = isToday ? '今天' : `${dateObj.getMonth()+1}月${dateObj.getDate()}日`;
                const dateColor = isToday ? 'text-red-300' : 'text-white';
                
                html += `
                <div class="aspect-square bg-white dark:bg-black/20 rounded-3xl overflow-hidden relative group card-shadow cursor-pointer transition-transform hover:scale-[1.02]">
                    <img src="${item.imageBase64}" class="w-full h-full object-cover p-1 rounded-3xl">
                    <div class="absolute top-3 left-3 flex gap-1 flex-wrap pr-12">${tagHtml}</div>
                    <div class="absolute top-2 right-2 flex flex-col gap-2 opacity-0 md:group-hover:opacity-100 transition-opacity z-10">
                        <button class="bg-white text-black p-2.5 rounded-2xl transform active:scale-90 shadow-md hover:bg-gray-50" onclick="event.stopPropagation(); openEditItemModal('${item.id}')">
                            <i class="ph-bold ph-pencil-simple text-sm"></i>
                        </button>
                        <button class="bg-red-50 text-red-500 p-2.5 rounded-2xl transform active:scale-90 shadow-md hover:bg-red-100" onclick="event.stopPropagation(); deleteQuestion('${item.id}')">
                            <i class="ph-bold ph-trash text-sm"></i>
                        </button>
                    </div>
                    <div class="absolute bottom-0 w-full bg-gradient-to-t from-black/80 to-transparent p-3 pt-10 ${dateColor} text-xs font-bold tracking-wide rounded-b-3xl">
                        下次复习: ${dateStr}
                    </div>
                </div>`;
            });
            
            if (filteredData.length === 0) {
                html = `
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-textMuted">
                    <i class="ph-bold ph-archive-box text-4xl mb-3 opacity-30"></i>
                    <p class="font-bold text-sm">该分类下暂无错题</p>
                </div>`;
            }
            gallery.innerHTML = html;
        }

        async function deleteQuestion(id) {
            if(confirm('确定删除这张错题卡片吗？')) {
                questions = questions.filter(q => q.id !== id);
                await localforage.setItem(DB_QUESTIONS, questions);
                renderGallery(currentFilter);
                showToast('已删除错题');
            }
        }

        let editingItemId = null;
        let editingItemTags = [];

        function openEditItemModal(id) {
            editingItemId = id;
            const item = questions.find(q => q.id === id);
            if(!item) return;
            document.getElementById('edit-item-preview').src = item.imageBase64;
            editingItemTags = [...item.tags];
            renderEditItemTags();
            openModal('edit-item-modal');
        }

        function renderEditItemTags() {
            const container = document.getElementById('edit-item-tags-container');
            container.innerHTML = allTags.map(tag => {
                const isSelected = editingItemTags.includes(tag);
                const bg = isSelected ? 'var(--color-primary-light)' : 'var(--color-border)';
                const col = isSelected ? 'var(--color-primary)' : 'var(--color-text-muted)';
                return `<button onclick="toggleEditItemTag('${tag}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-transform active:scale-95 shadow-sm" style="background-color: ${bg}; color: ${col}">${tag}</button>`;
            }).join('');
        }

        function toggleEditItemTag(tag) {
            if (editingItemTags.includes(tag)) editingItemTags = editingItemTags.filter(t => t !== tag);
            else editingItemTags.push(tag);
            renderEditItemTags();
        }

        async function saveEditItem() {
            const idx = questions.findIndex(q => q.id === editingItemId);
            if(idx > -1) {
                questions[idx].tags = [...editingItemTags];
                await localforage.setItem(DB_QUESTIONS, questions);
                renderGallery(currentFilter);
                showToast('标签已更新');
            }
            closeModal('edit-item-modal');
        }

        function renderManageTags() {
            const list = document.getElementById('manage-tags-list');
            list.innerHTML = allTags.map(tag => 
                `<button onclick="deleteTag('${tag}')" class="px-4 py-2 bg-red-50 dark:bg-red-900/10 text-red-600 border border-red-100 dark:border-red-900/30 rounded-xl text-xs font-bold active:scale-95 flex items-center gap-1 group shadow-sm transition-transform">
                    ${tag} <i class="ph-bold ph-x group-hover:scale-125 transition-transform"></i>
                </button>`
            ).join('');
        }

        async function addNewTag() {
            const input = document.getElementById('new-tag-input');
            const val = input.value.trim();
            if(val && !allTags.includes(val)) {
                allTags.push(val);
                await localforage.setItem(DB_TAGS, allTags);
                input.value = '';
                renderManageTags();
                renderUploadTags();
                renderGalleryFilters();
            }
        }

        async function deleteTag(tag) {
            if(confirm(`删除标签 "${tag}"？已绑定该标签的错题不受影响。`)) {
                allTags = allTags.filter(t => t !== tag);
                selectedUploadTags = selectedUploadTags.filter(t => t !== tag);
                await localforage.setItem(DB_TAGS, allTags);
                renderManageTags();
                renderUploadTags();
                renderGalleryFilters();
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if (id === 'tag-modal') renderManageTags();
            if (id === 'theme-modal') renderThemeColors();
            requestAnimationFrame(() => {
                document.getElementById(`${id}-bg`).classList.remove('opacity-0');
                document.getElementById(`${id}-content`).classList.remove('translate-y-full');
            });
        }

        function closeModal(id) {
            document.getElementById(`${id}-bg`).classList.add('opacity-0');
            document.getElementById(`${id}-content`).classList.add('translate-y-full');
            setTimeout(() => document.getElementById(id).classList.add('hidden'), 250);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('hidden');
            void toast.offsetWidth;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100', 'translate-y-2');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-2');
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 250);
            }, 2000);
        }

        initApp();
    </script>
</body>
</html>
